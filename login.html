<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<style>
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        font-family: 'Sarabun', sans-serif;
    }

    .frame {
        max-width: 900px;
        position: relative;
    }

    .side-panel {
        background-color: #1b2a5c;
        color: #fff;
        min-height: 440px;
        position: relative;
        overflow: hidden;
    }

    .dear-student {
        position: relative;
        z-index: 1;
        color: #d30606;
        font-weight: 700;
        text-decoration: underline;
        text-decoration-color: #d30606;
        text-underline-offset: 6px;

    }

    .Back-text {
        position: absolute;
        left: 18px;
        bottom: 70px;
        font-size: 4.2rem;
        font-weight: 800;
        color: transparent;
        -webkit-text-stroke: 2px rgba(255, 255, 255, 0.18);
    }

    .side-text {
        position: relative;
        z-index: 1;
        margin-top: auto;
    }

    .login-title {
        font-weight: 800;
        color: #1b2a5c;
        text-align: center;
    }

    .title-bar {
        width: 90px;
        height: 3px;
        background-color: #1b2a5c;
        margin: 0 auto 1.25rem;
    }

    .socier a {
        width: 30px;
        height: 30px;
        border: 1.5px solid #e3262e;
        color: #e3262e;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
    }

    :root {
        --navy: #1b2a5c;
        --yellow: #f7c948;
        --red: #e3262e;
    }

    .btn-navy {
        background: var(--navy);
        color: #fff;
        border-radius: 999px;
        padding: .45rem 2.5rem;
        font-weight: 600;
    }

    .btn-navy:hover {
        background: #111b40;
        color: #fff;
    }

    @media (max-width: 767.98px) {
        .side-panel {
            min-height: 240px;
        }

        .back-text {
            font-size: 3rem;
        }
    }

    .brand {
        font-size: .75rem;
        font-weight: 700;
        color: var(--navy);
    }

    .brand span {
        color: var(--red);
    }
    .side-panel .ring {
  position: absolute;
  width: 170px;
  height: 170px;
  border: 10px solid #fff;
  border-right-color: transparent;
  border-radius: 50%;
  right: -85px;
  top: 50%;
  transform: translateY(-50%);
}
</style>

<body>
    <main class="container frame px-3">

    </main>
    <div>
        <script src="js/bootstrap.bundle.min.js"></script>
    </div>
    <div class="row g-0 shadow-lg rounded-4 overflow-hidden bg-white">
        <section class="col-md-6">ฝั่งซ้าย</section>
        <section class="col-md-6">ฝั่งขวา</section>
    </div>
    <section class="col-md-6 side-panel d-flex flex-column p-4 p-md-5">
        <div class="ring"></div>
        <h2 class="dear-student">Dear Student</h2>
        <div class="Back-text">Back to<br>School</div>
        <p class="side-text mb-0">Login to your account</p>

    </section>
    <section class="col-md-6 bg-white p-4 p-md-5">
        <div class="d-flex justify-content-end">
            <span class="brand">Sakoltajwittayanukul <span>School</span></span>
        </div>

        <h2 class="login-title">Login to Account</h2>
        <div class="socier text-center mb-2">
            <a href="#"><i class="bi bi-google"></i></a>
            <a href="#"><i class="bi bi-facebook"></i></a>
            <a href="#"><i class="bi bi-twitter-x"></i></a>
        </div>
        <p class="text-center text-muted small mb-4">Or use your email account</p>
    </section>
    <form id="loginForm" novalidate>

        <div class="mb-3">
            <div class="field-label">Email</div>
            <input type="email" class="form-control" id="email">
            <div class="invalid-feedback" id="emailFeedback">กรุณากรอกอีเมลให้ถูกต้อง</div>
        </div>

        <div class="mb-3">
            <div class="field-label">Password</div>
            <div class="input-group">
                <input type="password" class="form-control" id="password">
                <button class="btn toggle-btn" type="button" id="togglePass">แสดง</button>
            </div>
            <div class="invalid-feedback" id="passFeedback">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check mb-0">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label small" for="remember">Remember me</label>
            </div>
            <a href="#" class="forgot">Forgot Password ?</a>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-navy">Login</button>
        </div>

        <p class="text-center small mt-4 mb-0">
            Already have an account? <a href="#" class="sign-up">Sign Up</a>
        </p>
    </form>
    <script>
        const form = document.getElementById('loginForm');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const emailFeedback = document.getElementById('emailFeedback');
        const passFeedback = document.getElementById('passFeedback');
        const togglePass = document.getElementById('togglePass');

        togglePass.addEventListener('click', () => {
            const isHidden = password.type === 'password';
            password.type = isHidden ? 'text' : 'password';
            togglePass.textContent = isHidden ? 'ซ่อน' : 'แสดง';
        });


        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
            const passOk = password.value.length >= 6;

            email.classList.toggle('is-invalid', !emailOk);
            emailFeedback.classList.toggle('d-block', !emailOk);

            password.classList.toggle('is-invalid', !passOk);
            passFeedback.classList.toggle('d-block', !passOk);

            if (!emailOk || !passOk) return;

            alert('Login สำเร็จ (ตัวอย่าง)');
        });
    </script>
</body>

</html>
